<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluasi Kegiatan - KampusEval</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <!-- Navbar -->
    <nav id="main-nav">
        <div class="container nav-content">
            <a href="index.html" class="logo">
                <img src="assets/img/logo.png" alt="KampusEval Logo">
            </a>
            <ul class="nav-links">
                <li class="user-only"><a href="index.html">Beranda</a></li>
                <li class="user-only"><a href="about.html">Tentang</a></li>
                <li class="user-only"><a href="panduan.html">Panduan</a></li>
                <li><a href="evaluasi.html" class="active">Evaluasi</a></li>
                <li id="admin-link" style="display: none;"><a href="admin.html">Panel Admin</a></li>
            </ul>
            <div class="auth-btns" id="user-profile" style="display: flex;">
                <span id="user-name" style="font-weight: 600; margin-right: 1.5rem;">Memuat...</span>
                <button id="logout-btn" class="btn btn-outline"
                    style="padding: 0.4rem 1rem; font-size: 0.9rem;">Logout</button>
            </div>
        </div>
    </nav>

    <header class="hero">
        <div class="container">
            <h1>Form <span style="color: var(--secondary-color);">Evaluasi Kegiatan</span></h1>
            <p>Berikan penilaian dan masukan Anda untuk kemajuan kegiatan kampus.</p>
        </div>
    </header>

    <main class="container">
        <div class="card">
            <form id="evaluation-form">
                <div class="grid-2">
                    <div class="form-group">
                        <label for="evaluator-name">Nama Anda</label>
                        <input type="text" id="evaluator-name" placeholder="Nama Lengkap" required>
                    </div>
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label for="evaluator-institution">Universitas / Instansi / Sekolah</label>
                        <input type="text" id="evaluator-institution" placeholder="Asal Instansi" required>
                    </div>
                    <div class="form-group">
                        <label for="evaluator-role">Peran</label>
                        <input type="text" id="evaluator-role" placeholder="Contoh: Mahasiswa, Dosen, Umum" required>
                    </div>
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label for="activity">Nama Kegiatan</label>
                        <input type="text" id="activity" placeholder="Contoh: Seminar Nasional TI 2026" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="activity-details">Isi Kegiatan (Deskripsi Singkat)</label>
                    <textarea id="activity-details" rows="3" placeholder="Jelaskan secara singkat kegiatan ini..."
                        required></textarea>
                </div>

                <div class="form-group">
                    <label>Penilaian Keseluruhan</label>
                    <div class="rating-stars">
                        <input type="radio" name="rating" value="1" id="star1" required>
                        <label for="star1"><i class="fas fa-star"></i></label>
                        <input type="radio" name="rating" value="2" id="star2">
                        <label for="star2"><i class="fas fa-star"></i></label>
                        <input type="radio" name="rating" value="3" id="star3">
                        <label for="star3"><i class="fas fa-star"></i></label>
                        <input type="radio" name="rating" value="4" id="star4">
                        <label for="star4"><i class="fas fa-star"></i></label>
                        <input type="radio" name="rating" value="5" id="star5">
                        <label for="star5"><i class="fas fa-star"></i></label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="feedback">Masukan & Kritik</label>
                    <textarea id="feedback" rows="5" placeholder="Berikan pendapat Anda tentang kegiatan ini..."
                        required></textarea>
                </div>

                <div class="form-group">
                    <label for="documentation">Upload Dokumentasi (Foto) <span
                            style="font-weight: normal; color: var(--text-secondary); font-size: 0.85rem;">(Opsional)</span></label>
                    <input type="file" id="documentation" accept="image/*">
                    <p class="form-hint">Maksimal 5MB. Gambar akan diunggah ke Cloudinary.</p>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;"
                    id="submit-btn">Kirim Evaluasi</button>
            </form>
        </div>
    </main>

    <footer style="margin-top: 5rem;">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 KampusEval. Terima kasih atas partisipasi Anda.</p>
            </div>
        </div>
    </footer>

    <script type="module" src="assets/js/firebase-config.js"></script>
    <script type="module" src="assets/js/auth.js"></script>
    <script type="module" src="assets/js/evaluasi.js"></script>
    <script>
        // Simple star rating interaction
        const stars = document.querySelectorAll('.star');
        stars.forEach((star, index) => {
            star.addEventListener('click', () => {
                stars.forEach((s, i) => {
                    const icon = s.querySelector('i');
                    if (i <= index) {
                        icon.style.color = '#fbbf24'; // Warning color
                    } else {
                        icon.style.color = '#e2e8f0';
                    }
                });
            });
        });
    </script>
</body>

</html>
