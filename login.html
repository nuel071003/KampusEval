<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - KampusEval</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body style="background: radial-gradient(circle at bottom left, #e0e7ff, #f8fafc);">

    <!-- Navbar for consistency -->
    <nav id="main-nav">
        <div class="container nav-content">
            <a href="index.html" class="logo">
                <img src="assets/img/logo.png" alt="KampusEval Logo">
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Beranda</a></li>
                <li><a href="about.html">Tentang</a></li>
                <li><a href="panduan.html">Panduan</a></li>
                <li><a href="kontak.html">Kontak</a></li>
                <li id="evaluasi-link" style="display: none;"><a href="evaluasi.html">Evaluasi</a></li>
            </ul>
            <div class="auth-btns" id="auth-buttons">
                <a href="login.html" class="btn btn-primary">Login</a>
                <a href="register.html" class="btn btn-outline">Register</a>
            </div>
            <div class="auth-btns" id="user-profile" style="display: none;">
                <span id="user-name" style="font-weight: 600; margin-right: 1.5rem;">User Name</span>
                <button id="logout-btn" class="btn btn-outline"
                    style="padding: 0.4rem 1rem; font-size: 0.9rem;">Logout</button>
            </div>
        </div>
    </nav>

    <div class="auth-container">
        <div style="text-align: center; margin-bottom: 2rem;">
            <a href="index.html"><img src="assets/img/logo.png" alt="KampusEval" style="height: 50px;"></a>
            <h2 style="margin-top: 1rem;">Selamat Datang Kembali</h2>
            <p style="color: var(--text-secondary);">Masuk untuk melanjutkan evaluasi.</p>
        </div>

        <form id="login-form">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Masukkan email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Masukkan password" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;"
                id="submit-btn">Masuk</button>
        </form>

        <p style="text-align: center; margin-top: 2rem; color: var(--text-secondary);">
            Belum punya akun? <a href="register.html" style="color: var(--secondary-color); font-weight: 600;">Daftar di
                sini</a>
        </p>
    </div>

    <script type="module" src="assets/js/firebase-config.js"></script>
    <script type="module" src="assets/js/auth.js"></script>
    <script type="module" src="assets/js/login.js"></script>
</body>

</html>
